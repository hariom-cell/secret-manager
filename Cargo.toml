[workspace]
members = [
    "crates/vault-core",
    "crates/vault-db",
    "crates/vault-sdk",
    "crates/vault-cli",
    "crates/vault-linux",
    "crates/vault-macos",
    "crates/vault-android",
    "crates/vault-windows",
    "crates/vault-wasm",
    "fuzz",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.75"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
opt-level = "z"  # optimize for size (security tools benefit from smaller attack surface)
