name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    # Nightly dependency audit (runs against main only)
    - cron: "0 0 * * 0"

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ─── Test ────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Fuzz harness (smoke)
        run: cargo run -p vault-fuzz --bin fuzz_format_parse -- 1000

      - name: AEAD roundtrip (smoke)
        run: cargo run -p vault-fuzz --bin fuzz_aead_roundtrip -- 1000

  # ─── Security Audit ───────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit --workspace

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check deny.toml
        run: |
          if [ -f deny.toml ]; then
            cargo deny --workspace check all
          else
            echo "deny.toml not found — skipping"
          fi

  # ─── Build ───────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }} --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/vault-cli*
            target/${{ matrix.target }}/release/vault-cli.exe
          compression-level: 9

  # ─── Android Cross-Compile ────────────────────────────────────────────────
  android:
    name: Android Cross-Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Build for Android
        run: |
          export CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          export AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          scripts/android-build.sh build/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-aarch64
          path: build/android/**
          compression-level: 9

  # ─── iOS Cross-Compile ────────────────────────────────────────────────────
  ios:
    name: iOS Cross-Compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS target
        run: rustup target add aarch64-apple-ios

      - name: Build for iOS
        run: scripts/ios-build.sh build/ios

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-aarch64
          path: build/ios/**
          compression-level: 9
