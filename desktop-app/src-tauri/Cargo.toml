[package]
name = "secret-manager-desktop"
version = "0.1.0"
edition = "2021"
description = "Secret Manager Desktop — privacy-first password vault"
authors = ["Secret Manager Contributors"]
license = "MIT"
repository = "https://github.com/your-org/secret-manager"
rust-version = "1.75"

[[bin]]
name = "secret-manager-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vault-core = { path = "../../crates/vault-core" }
vault-db = { path = "../../crates/vault-db" }
vault-sdk = { path = "../../crates/vault-sdk" }
arboard = "3"
dirs = "6"
hex = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
