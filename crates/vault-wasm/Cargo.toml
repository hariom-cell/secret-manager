[package]
name = "vault-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "WASM bindings for the vault-core cryptographic library"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vault-core = { path = "../vault-core", version = "0.1.0", default-features = false }
vault-sdk = { path = "../vault-sdk", version = "0.1.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"

[features]
default = ["console_error_panic_hook"]

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true