description = "CLI for the Secret Manager encrypted vault"
rust-version = "1.75"

[dependencies]
vault-core = { path = "../vault-core" }
vault-db = { path = "../vault-db" }
vault-sdk = { path = "../vault-sdk" }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

