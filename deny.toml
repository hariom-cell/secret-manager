[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "AGPL-3.0-or-later",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "MPL-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"  # syn v2/v3: needed by curve25519-dalek (v2) and serde (v3)
wildcards = "warn"          # workspace path deps without explicit versions
highlight = "all"
deny = []
skip = [
    "vault-android",
    "vault-cli",
    "vault-core",
    "vault-db",
    "vault-fuzz",
    "vault-linux",
    "vault-macos",
    "vault-sdk",
    "vault-windows",
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
